name: Update spec-short data

on:
  schedule:
    - cron: "0 22 * * *"     # Daily at 22:00 UTC (~after US market close)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["fetch_data.py", ".github/workflows/update.yml"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data
        id: fetch
        run: python fetch_data.py

      - name: Commit if changed
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No data change."
            exit 0
          fi
          git commit -m "Update data $(date -u +%Y-%m-%d)"
          # Rebase onto whatever's on the remote right now before pushing,
          # so a near-simultaneous run doesn't cause a rejected push.
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin main; then
                echo "Pushed successfully."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Push attempt $i failed, retrying in $((i*5))s..."
            sleep $((i*5))
          done
          echo "::error::Failed to push data.json after 5 attempts."
          exit 1

      - name: Summarize failure
        if: failure()
        run: |
          echo "## ❌ Data update failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the 'Fetch data' and 'Commit if changed' step logs above." >> "$GITHUB_STEP_SUMMARY"
          echo "- If 'Fetch data' failed: Yahoo is likely blocking this runner (TLS-fingerprint/IP block). See the comment at the top of fetch_data.py." >> "$GITHUB_STEP_SUMMARY"
          echo "- If 'Commit if changed' failed: a concurrent run likely raced the push. This should now auto-retry with rebase; if it still fails after 5 attempts, check for overlapping schedules or manual runs." >> "$GITHUB_STEP_SUMMARY"
