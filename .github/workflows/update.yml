name: Update spec-short data

on:
  schedule:
    # Daily at 22:00 UTC (~after US market close).
    - cron: "0 22 * * *"
  workflow_dispatch:        # lets you trigger a run manually from the Actions tab
  push:
    branches: [main]
    paths: ["fetch_data.py", ".github/workflows/update.yml"]

permissions:
  contents: write           # needed to commit data.json back to the repo

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data
        run: python fetch_data.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No data change."
          else
            git commit -m "Update data $(date -u +%Y-%m-%d)"
            git push
          fi
